
{% extends "base.html" %}

{% block title %}Seat Availability | Railway Reservation{% endblock %}

{% block content %}
<section class="availability-page">
    <h1>Check Seat Availability</h1>
    <p>Enter your train details to check available seats.</p>

    <form id="availability-form">
        <div>
            <label for="train_id">Train ID</label>
            <input
                type="number"
                id="train_id"
                name="train_id"
                min="1"
                placeholder="Example: 1"
                required
            >
        </div>

        <div>
            <label for="date">Travel Date</label>
            <input
                type="date"
                id="date"
                name="date"
                required
            >
        </div>

        <div>
            <label for="class">Travel Class</label>
            <select id="class" name="class" required>
                <option value="">Select class</option>
                <option value="SL">Sleeper (SL)</option>
                <option value="3A">AC 3 Tier (3A)</option>
                <option value="2A">AC 2 Tier (2A)</option>
            </select>
        </div>

        <button type="submit">Check Availability</button>
    </form>

    <div id="availability-result" aria-live="polite"></div>
</section>
{% endblock %}
