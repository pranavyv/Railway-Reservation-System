{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" class="card narrow" data-form="login" novalidate>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" value="{{ form.get('email', '') }}" required>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="button" class="link toggle" data-toggle="password">Show password</button>

  <button type="submit">Log in</button>
  <p class="hint">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</form>
{% endblock %}
