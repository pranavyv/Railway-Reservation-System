{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Create your account</h1>
<form method="post" class="card narrow" data-form="register" novalidate>
  <label for="name">Full name</label>
  <input id="name" name="name" type="text" value="{{ form.get('name', '') }}" required>

  <label for="email">Email</label>
  <input id="email" name="email" type="email" value="{{ form.get('email', '') }}" required>

  <label for="password">Password (at least 8 characters)</label>
  <input id="password" name="password" type="password" autocomplete="new-password" required>
  <button type="button" class="link toggle" data-toggle="password">Show password</button>

  <button type="submit">Create account</button>
  <p class="hint">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</form>
{% endblock %}
