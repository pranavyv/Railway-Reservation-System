<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Railway Reservation{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}">Railway Reservation</a>
    <nav>
      {% if session.user_id %}
        <a href="{{ url_for('search_page') }}">Search trains</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <form method="post" action="{{ url_for('logout') }}" class="inline">
          <button type="submit" class="link">Log out ({{ session.user_name }})</button>
        </form>
      {% else %}
        <a href="{{ url_for('login') }}">Log in</a>
        <a href="{{ url_for('register') }}">Register</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash {{ category }}" role="alert">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
