name: CI-CD
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest coverage
      - run: coverage run -m pytest -v
      - run: coverage report
      - run: coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  package:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -r rrs-release.zip . -x ".git/*" "tests/*" "docs/reports/*"
      - uses: actions/upload-artifact@v4
        with:
          name: rrs-release
          path: rrs-release.zip